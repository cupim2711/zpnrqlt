function u(x){return Uint8Array.from(atob(x),function(c){return c.charCodeAt(0)})}
function norm(v){return v.toLowerCase().replace(/[^a-z]/g,"")}
async function tryPw(pw){
var k0=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
var k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(P.s),iterations:100000,hash:"SHA-256"},k0,{name:"AES-GCM",length:256},false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:u(P.i)},k,u(P.c)));
}
